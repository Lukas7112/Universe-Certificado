name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependências Node
        run: npm install

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inicializar Capacitor
        run: |
          npx cap init "Universe Certificados" "br.com.universe.certificados" --web-dir src

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Copiar assets web para Android
        run: npx cap copy android

      - name: Configurar permissões do Gradle
        run: chmod +x android/gradlew

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Certificados-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
